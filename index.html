<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>הסטודיו — צ'אט</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand: #EDE6D6;
    --card: #FBF9F1;
    --ink: #241F1A;
    --ink-soft: #6B6457;
    --pine: #1F4B3F;
    --pine-dark: #163A31;
    --gold: #C99A3E;
    --rust: #A8462B;
    --line: #DCD3BE;
    --bubble-user: #1F4B3F;
    --bubble-bot: #FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(31,75,63,0.08), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(201,154,62,0.10), transparent 40%),
      var(--sand);
    font-family:'Assistant', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 14px;
  }

  .phone{
    width:100%;
    max-width:420px;
    height:min(760px, 92vh);
    background:var(--card);
    border-radius:28px;
    box-shadow: 0 30px 60px -20px rgba(36,31,26,0.35), 0 0 0 1px rgba(36,31,26,0.05);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }

  /* ===== Header ===== */
  .header{
    background: linear-gradient(160deg, var(--pine) 0%, var(--pine-dark) 100%);
    color:#F4EFE2;
    padding:20px 20px 16px;
    position:relative;
    overflow:hidden;
    flex-shrink:0;
  }
  .header::after{
    content:"";
    position:absolute;
    inset:0;
    background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:12px;
    position:relative;
    z-index:1;
  }
  .brand-mark{
    width:44px;height:44px;
    border-radius:12px;
    background:rgba(244,239,226,0.12);
    border:1px solid rgba(244,239,226,0.25);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{width:24px;height:24px;}
  .brand-name{
    font-family:'Rubik', sans-serif;
    font-weight:800;
    font-size:19px;
    letter-spacing:-0.2px;
  }
  .brand-sub{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    color:#CFE0D8;
    margin-top:2px;
  }
  .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 3px rgba(201,154,62,0.25);
    flex-shrink:0;
  }
  .pulse-line{
    margin-top:14px;
    height:22px;
    position:relative;
    z-index:1;
  }
  .pulse-line svg{width:100%;height:100%;display:block;}

  /* ===== Messages ===== */
  .messages{
    flex:1;
    overflow-y:auto;
    padding:18px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:
      linear-gradient(var(--sand), var(--sand));
  }
  .messages::-webkit-scrollbar{width:6px;}
  .messages::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

  .msg-row{display:flex; max-width:86%;}
  .msg-row.user{align-self:flex-start; flex-direction:row;}
  .msg-row.bot{align-self:flex-end; flex-direction:row-reverse;}

  .bubble{
    padding:11px 14px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.55;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .msg-row.user .bubble{
    background:var(--bubble-user);
    color:#F4EFE2;
    border-bottom-left-radius:4px;
  }
  .msg-row.bot .bubble{
    background:var(--bubble-bot);
    color:var(--ink);
    border:1px solid var(--line);
    border-bottom-right-radius:4px;
  }

  .eyebrow{
    align-self:center;
    font-size:11.5px;
    color:var(--ink-soft);
    background:rgba(36,31,26,0.05);
    padding:4px 10px;
    border-radius:20px;
    margin:4px 0 8px;
  }

  .quick-replies-wrap{
    position:relative;
    flex-shrink:0;
    padding:2px 0 12px;
    background:var(--sand);
  }
  .quick-replies{
    display:flex;
    gap:7px;
    padding:2px 40px;
    overflow-x:auto;
    scroll-behavior:smooth;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .quick-replies::-webkit-scrollbar{display:none;}
  .chip{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--pine-dark);
    font-family:'Assistant', sans-serif;
    font-weight:600;
    font-size:12.5px;
    padding:7px 13px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
    flex-shrink:0;
    transition:transform .12s ease, background .12s ease;
  }
  .chip:hover{background:#F1ECDC; transform:translateY(-1px);}
  .chip:active{transform:translateY(0) scale(0.97);}

  .scroll-fade{
    position:absolute;
    top:0; bottom:12px;
    width:38px;
    pointer-events:none;
    z-index:2;
  }
  .scroll-fade.right{ right:0; background:linear-gradient(to left, var(--sand), transparent); }
  .scroll-fade.left{ left:0; background:linear-gradient(to right, var(--sand), transparent); }

  .scroll-btn{
    position:absolute;
    top:0; bottom:12px;
    width:30px;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    border:none;
    cursor:pointer;
    z-index:3;
    color:var(--pine-dark);
    opacity:0.8;
  }
  .scroll-btn:hover{opacity:1;}
  .scroll-btn.right{ right:2px; }
  .scroll-btn.left{ left:2px; }
  .scroll-btn svg{width:16px;height:16px;}

  .typing{
    align-self:flex-end;
    display:flex;
    gap:4px;
    background:var(--bubble-bot);
    border:1px solid var(--line);
    padding:12px 14px;
    border-radius:16px;
    border-bottom-right-radius:4px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--ink-soft);
    opacity:.5;
    animation:blink 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{
    0%,80%,100%{opacity:.35; transform:translateY(0);}
    40%{opacity:1; transform:translateY(-2px);}
  }

  /* ===== Input ===== */
  .input-bar{
    display:flex;
    gap:8px;
    padding:12px 14px;
    background:var(--card);
    border-top:1px solid var(--line);
    flex-shrink:0;
  }
  .input-bar input{
    flex:1;
    border:1px solid var(--line);
    background:var(--sand);
    border-radius:14px;
    padding:11px 14px;
    font-family:'Assistant', sans-serif;
    font-size:14.5px;
    color:var(--ink);
    outline:none;
  }
  .input-bar input:focus{
    border-color:var(--pine);
    background:#fff;
  }
  .input-bar input::placeholder{color:var(--ink-soft);}
  .send-btn{
    width:44px;height:44px;
    border-radius:14px;
    border:none;
    background:var(--pine);
    color:#F4EFE2;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:background .15s ease, transform .1s ease;
  }
  .send-btn:hover{background:var(--pine-dark);}
  .send-btn:active{transform:scale(0.94);}
  .send-btn:disabled{background:#B9B29C; cursor:not-allowed;}
  .send-btn svg{width:18px;height:18px;}

  @media (prefers-reduced-motion: reduce){
    .typing span{animation:none;}
    .chip{transition:none;}
  }
</style>
</head>
<body>

<div class="phone">
  <div class="header">
    <div class="brand-row">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F4EFE2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 6.5l11 11M6 4l14 14M4 6l1.5-1.5M18.5 19.5L20 18M2 8l2-2M20 16l2 2M8 2l-2 2M16 20l-2 2"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">הסטודיו</div>
        <div class="brand-sub"><span class="dot"></span> אימונים אישיים · באר שבע</div>
      </div>
    </div>
    <div class="pulse-line">
      <svg viewBox="0 0 400 22" preserveAspectRatio="none">
        <polyline points="0,11 60,11 78,3 92,19 108,11 400,11" fill="none" stroke="#C99A3E" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
      </svg>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="quick-replies-wrap">
    <div class="quick-replies" id="quickReplies"></div>
    <div class="scroll-fade left"></div>
    <div class="scroll-fade right"></div>
    <button class="scroll-btn left" id="scrollLeft" aria-label="גלילה שמאלה">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="scroll-btn right" id="scrollRight" aria-label="גלילה ימינה">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <div class="input-bar">
    <input id="userInput" type="text" placeholder="כתבו הודעה…" autocomplete="off">
    <button class="send-btn" id="sendBtn" aria-label="שליחה">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M12 4l8 8-8 8"/></svg>
    </button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const quickRepliesEl = document.getElementById('quickReplies');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

let history = [];

const STARTER_CHIPS = [
  "שעות פעילות",
  "מחירים ומסלולים",
  "סוגי אימונים",
  "מדיניות ביטולים",
  "כתובת הסטודיו",
  "קביעת אימון ניסיון",
  "דיבור עם נציג"
];

function addBubble(role, text){
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'bot');
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function showTyping(){
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typingRow';
  row.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function hideTyping(){
  const el = document.getElementById('typingRow');
  if(el) el.remove();
}

const CHIP_MESSAGES = {
  "שעות פעילות": "מה שעות הפעילות של הסטודיו?",
  "מחירים ומסלולים": "אילו מסלולי תשלום ומחירים יש לכם?",
  "סוגי אימונים": "אילו סוגי אימונים אפשר לעשות אצלכם?",
  "מדיניות ביטולים": "מה מדיניות הביטולים שלכם?",
  "כתובת הסטודיו": "מה הכתובת של הסטודיו?",
  "קביעת אימון ניסיון": "אני רוצה לקבוע אימון ניסיון",
  "דיבור עם נציג": "אני רוצה לדבר עם נציג אנושי"
};

function renderChips(){
  quickRepliesEl.innerHTML = '';
  STARTER_CHIPS.forEach(label => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = label;
    chip.onclick = () => { inputEl.value = CHIP_MESSAGES[label] || label; sendMessage(); };
    quickRepliesEl.appendChild(chip);
  });
}

async function sendMessage(){
  const text = inputEl.value.trim();
  if(!text) return;
  inputEl.value = '';
  sendBtn.disabled = true;

  addBubble('user', text);
  history.push({ role: 'user', content: text });
  showTyping();

  try{
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });
    const data = await response.json();
    hideTyping();

    if(!response.ok){
      throw new Error(data.error || 'Server error');
    }

    const replyText = data.reply || 'מצטער, לא הצלחתי לענות כרגע. אפשר לנסות שוב?';

    addBubble('bot', replyText);
    history.push({ role: 'assistant', content: replyText });
  }catch(err){
    hideTyping();
    addBubble('bot', 'משהו השתבש בחיבור. אפשר לנסות שוב, או ליצור קשר טלפוני עם הסטודיו: 054-1234567.');
    console.error('Chat error:', err);
  }finally{
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', e => { if(e.key === 'Enter') sendMessage(); });

// Chip row scroll arrows (RTL: "left" button scrolls toward earlier chips)
document.getElementById('scrollLeft').addEventListener('click', () => {
  quickRepliesEl.scrollBy({ left: 140, behavior: 'smooth' });
});
document.getElementById('scrollRight').addEventListener('click', () => {
  quickRepliesEl.scrollBy({ left: -140, behavior: 'smooth' });
});

// Welcome message
addBubble('bot', 'היי! 👋 ברוכים הבאים לסטודיו לאימונים אישיים בבאר שבע.\nאשמח לעזור עם שעות פתיחה, מחירים, סוגי אימונים או תיאום פגישת היכרות. במה אפשר לעזור?');
renderChips();
</script>

</body>
</html>
